<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form dengan Live Preview Dokumen</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --text:#1a1c20; --muted:#6b7280;
    --border:#e2e4e8; --accent:#2563eb; --accent-ink:#ffffff;
    --paper:#ffffff; --paper-text:#111827; --paper-line:#111827;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181d; --panel:#1e2127; --text:#e7e9ec; --muted:#9aa0aa;
      --border:#2c3038; --accent:#4f8dff; --accent-ink:#0b0d10;
      --paper:#f7f7f5; --paper-text:#111827; --paper-line:#111827;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181d; --panel:#1e2127; --text:#e7e9ec; --muted:#9aa0aa;
    --border:#2c3038; --accent:#4f8dff; --accent-ink:#0b0d10;
    --paper:#f7f7f5; --paper-text:#111827; --paper-line:#111827;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto;}
  @media (max-width:860px){.wrap{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;}
  h2{margin:0 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
  input[type=text],input[type=date],textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:80px;}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .paper{background:var(--paper);color:var(--paper-text);border-radius:8px;padding:36px 40px;
    max-width:720px;margin:0 auto;min-height:960px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .paper h1{font-size:20px;text-align:center;margin:0 0 2px;}
  .paper .sub{text-align:center;font-size:12px;color:#555;margin-bottom:18px;border-bottom:2px solid var(--paper-line);padding-bottom:14px;}
  .row{display:flex;font-size:13px;margin:6px 0;}
  .row .k{width:150px;color:#444;}
  .row .v{flex:1;font-weight:600;min-height:16px;border-bottom:1px dotted #ccc;}
  .box{margin-top:16px;border:1px solid #ddd;border-radius:6px;padding:12px;font-size:13px;min-height:120px;white-space:pre-wrap;}
  .sign-area{display:flex;justify-content:space-between;margin-top:50px;font-size:13px;}
  .sign-box{text-align:center;width:180px;}
  .sign-box .line{border-top:1px solid #333;margin-top:60px;padding-top:4px;}
  .sign-box img{max-height:60px;max-width:160px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10;}
  .modal.open{display:flex;}
  .modal-inner{background:var(--panel);border-radius:12px;padding:16px;text-align:center;}
  canvas{border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;}
  @media print{
    body{background:#fff;}
    .panel:first-child, .actions, .modal{display:none !important;}
    .wrap{display:block;padding:0;}
    .paper{box-shadow:none;max-width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>Input Data</h2>
    <label>Nomor Dokumen</label>
    <input id="i-no" type="text" placeholder="001/DOC/2026">
    <label>Tanggal</label>
    <input id="i-tgl" type="date">
    <label>Nama</label>
    <input id="i-nama" type="text" placeholder="Nama lengkap">
    <label>Jabatan / Departemen</label>
    <input id="i-jab" type="text" placeholder="Jabatan / Departemen">
    <label>Perihal</label>
    <input id="i-perihal" type="text" placeholder="Perihal dokumen">
    <label>Isi / Catatan</label>
    <textarea id="i-isi" placeholder="Tulis isi atau catatan di sini..."></textarea>
    <div class="actions">
      <button class="btn-primary" id="btn-sign">Tanda Tangan</button>
      <button class="btn-secondary" id="btn-print">Cetak / Print</button>
    </div>
  </div>

  <div class="panel">
    <h2>Live Preview</h2>
    <div class="paper">
      <h1>DOKUMEN RESMI</h1>
      <div class="sub">Nomor: <span id="p-no">-</span> &nbsp;|&nbsp; Tanggal: <span id="p-tgl">-</span></div>
      <div class="row"><div class="k">Nama</div><div class="v" id="p-nama">-</div></div>
      <div class="row"><div class="k">Jabatan/Departemen</div><div class="v" id="p-jab">-</div></div>
      <div class="row"><div class="k">Perihal</div><div class="v" id="p-perihal">-</div></div>
      <div class="box" id="p-isi">-</div>
      <div class="sign-area">
        <div class="sign-box">
          <div id="sign-img"></div>
          <div class="line">Tanda Tangan</div>
        </div>
        <div class="sign-box">
          <div style="height:60px"></div>
          <div class="line" id="p-tgl2">Tanggal</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <canvas id="pad" width="320" height="160"></canvas>
    <div class="actions" style="justify-content:center">
      <button class="btn-secondary" id="btn-clear">Hapus</button>
      <button class="btn-primary" id="btn-save">Simpan</button>
      <button class="btn-secondary" id="btn-close">Batal</button>
    </div>
  </div>
</div>

<script>
const bind = (inId, outId) => {
  const inp = document.getElementById(inId);
  const out = document.getElementById(outId);
  const update = () => { out.textContent = inp.value.trim() || '-'; };
  inp.addEventListener('input', update);
  update();
};
bind('i-no','p-no'); bind('i-nama','p-nama'); bind('i-jab','p-jab'); bind('i-perihal','p-perihal'); bind('i-isi','p-isi');
document.getElementById('i-tgl').addEventListener('input', function(){
  const d = this.value ? new Date(this.value).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}) : '-';
  document.getElementById('p-tgl').textContent = d;
  document.getElementById('p-tgl2').textContent = d + ' — Tanggal';
});

// Signature
const modal = document.getElementById('modal');
const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d');
ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
let drawing = false;
function pos(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {x: t.clientX - r.left, y: t.clientY - r.top};
}
function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
function end(){ drawing = false; }
['mousedown','touchstart'].forEach(ev=>canvas.addEventListener(ev,start));
['mousemove','touchmove'].forEach(ev=>canvas.addEventListener(ev,move));
['mouseup','mouseleave','touchend'].forEach(ev=>canvas.addEventListener(ev,end));

document.getElementById('btn-sign').onclick = () => modal.classList.add('open');
document.getElementById('btn-close').onclick = () => modal.classList.remove('open');
document.getElementById('btn-clear').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
document.getElementById('btn-save').onclick = () => {
  try{
    document.getElementById('sign-img').innerHTML = '<img src="'+canvas.toDataURL('image/png')+'">';
  }catch(err){ console.error('Gagal menyimpan tanda tangan', err); }
  modal.classList.remove('open');
};
document.getElementById('btn-print').onclick = () => window.print();
</script>
</body>
</html>
